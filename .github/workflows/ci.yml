name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --no-plugins --no-scripts
      - run: composer phpstan
      - run: composer test
      # The build command, end to end, against the feeds this channel is configured for: a
      # workflow that only ever runs on the schedule is a workflow whose breakage is found at 04:00.
      - name: Build the database once
        run: php bin/build-advisory-db --output=out/advisories.sqlite --enrich=none
